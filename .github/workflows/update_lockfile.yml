name: Update pylock.toml

on:
  schedule:
    - cron: "0 3 1 * *" # Run monthly on the 1st of every month at 03:00 UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: "actions/checkout@v6"

      - name: Install uv
        uses: "astral-sh/setup-uv@v5"
        with:
          enable-cache: true

      - name: Regenerate pylock.toml
        run: |
          uv export --format pylock.toml --all-extras --default-index https://pypi.org/simple -o pylock.toml
          go run github.com/google/addlicense@v1.1.1 -c "DeepMind Technologies Limited" -y "2026" -l apache pylock.toml

      - name: Create Pull Request
        uses: "peter-evans/create-pull-request@v7"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update dependencies in pylock.toml"
          title: "Update pylock.toml dependencies"
          body: |
            Automated update of dependencies in `pylock.toml` triggered by ${{ github.event_name }}.

            Generated via `uv export --format pylock.toml --all-extras --default-index https://pypi.org/simple -o pylock.toml`.
          branch: "automated/update-pylock"
          delete-branch: true
          labels: |
            dependencies
            automated
